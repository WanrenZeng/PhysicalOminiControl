vae:
  path: checkpoints/vae
  sample_posterior: true

model:
  in_channels: 64
  out_channels: 64
  hidden_size: 768
  num_attention_heads: 12
  attention_head_dim: 64
  num_layers: 33
  mlp_ratio: 4.0
  axes_dims_rope: [16, 24, 24]
  theta: 10000

# End-to-end (joint) stage trains the DiT and the HFRM from scratch together, so
# no pretrained HFRM checkpoint is required. Provide pretrained_path only to warm
# start the HFRM from an existing run.
hfrm:
  base_dim: 96
  pretrained_path: null

# End-to-end coupling between the DiT and the HFRM. Teacher-forcing annealing
# starts high and decays low: the HFRM leans on the ground-truth LL early, then
# gradually switches to the DiT's own (detached) prediction. The *_start/_end
# keys take precedence over the static teacher_forcing_prob.
joint:
  flow_weight: 1.0
  teacher_forcing_prob: 0.5
  teacher_forcing_prob_start: 1.0
  teacher_forcing_prob_end: 0.0
  teacher_forcing_anneal_warmup: 0
  teacher_forcing_anneal_steps: 100000
  teacher_forcing_schedule: linear
  teacher_noise_std: 0.05
  high_frequency_weight: 0.5
  pixel_weight: 1.0
  ms_ssim_weight: 0.0

dataset:
  name: kaist
  root: ../datasets/KAIST_clean
  train_annotations: ../datasets/KAIST_clean/train_set.json
  validation_annotations: ../datasets/KAIST_clean/test_set.json
  horizontal_flip_prob: 0.5
  train_num_samples: null
  validation_num_samples: 100

train:
  stage: joint
  output_dir: runs/physical/kaist_joint
  run_name: null
  batch_size: 8
  validation_batch_size: 1
  num_workers: 8
  pin_memory: true
  devices: 1
  max_steps: 200000
  accumulate_grad_batches: 2
  gradient_clip_val: 1.0
  checkpoint_every_n_steps: 10000
  val_check_interval: 10000
  log_every_n_steps: 100
  tensorboard: true
  precision: bf16-mixed
  gradient_checkpointing: true
  optimizer:
    type: AdamW
    params:
      lr: 0.0001
      betas: [0.9, 0.95]
      weight_decay: 0.01

ema:
  enabled: true
  decay: 0.9999
  update_after_step: 1000
  use_warmup: true
  inv_gamma: 1.0
  power: 0.75

validation:
  num_inference_steps: 28
  vae_sample_posterior: true
  use_ema: true
  save_images: true
  tensorboard_images: true
  tensorboard_image_count: 4
  compute_fid: true
  fid_reference: source
  fid_num_workers: 4
  fid_batch_size: 8
  keep_fid_images: false
